spring:
  application:
    name: meeting-rooms
  datasource:
    url: jdbc:h2:mem:meetingrooms;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  booking:
    min-duration: 15m
    max-duration: 4h
  idempotency:
    retention: 24h
    cleanup-cron: "0 0 * * * *"
